# Local Postgres for development: docker compose up -d
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: saystreet
      POSTGRES_PASSWORD: saystreet
      POSTGRES_DB: saystreet
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saystreet"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres:
